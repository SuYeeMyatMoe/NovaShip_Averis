# NovaShip Averis — full stack (baked images; rebuild after code changes)
#   docker compose up -d --build
#   .\scripts\dev.ps1 docker          # stops local npm/uvicorn first, then Compose
#   API  -> http://localhost:${API_PORT:-8000}  (Swagger: /docs)
#   UI   -> http://localhost:${WEB_PORT:-3000}
# Live reload (bind-mounts): docker-compose.dev.yml or .\scripts\dev.ps1 docker-dev
# Do not run local `npm run dev` / `uvicorn --port 8000` at the same time as this stack.
# Default = offline demo (in-memory repo seeded from the SDOC bundle, rule-based AI).
# Set REPO_BACKEND=supabase + SUPABASE_* and/or LLM_PROVIDER + API key in .env to go live.
services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: [.env]
    environment:
      REPO_BACKEND: ${REPO_BACKEND:-memory}
      LLM_PROVIDER: ${LLM_PROVIDER:-none}
      AUTH_MODE: ${AUTH_MODE:-demo}
      BUNDLE_DIR: /data/bundle
      SEED_SNAPSHOT: /data/seed/snapshot.json
      EVAL_GROUND_TRUTH: /data/eval/data_v2/ground_truth.json   # self-evaluation (Workbench card / GET /evaluate); 404 when the file is absent
      EVAL_SCORING: /data/eval/server/scoring.py
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-local}
      VECTOR_STORE: ${VECTOR_STORE:-local}
      LANGGRAPH_CHECKPOINT: ${LANGGRAPH_CHECKPOINT:-memory}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    ports: ["${API_PORT:-8000}:8000"]
    volumes:
      - ./sdoc-hackathon-bundle:/data/bundle:ro
      - ./supabase/seed/snapshot.json:/data/seed/snapshot.json:ro
      - ./sdoc-hackathon-docker/data_v2:/data/eval/data_v2:ro   # ground_truth.json (gitignored locally; absent = evaluation disabled)
      - ./sdoc-hackathon-docker/server:/data/eval/server:ro     # the organiser's scoring.py
      - ./backend/data:/app/data          # RAG knowledge folder + local index (writable)
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost:8000}
    environment:
      NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost:8000}
    ports: ["${WEB_PORT:-3000}:3000"]
    depends_on: [api]
    restart: unless-stopped

  # Optional: the organisers' inbox/scoring server (needs sdoc-hackathon-docker/ present)
  sdoc-inbox:
    profiles: ["scoring"]
    build: ./sdoc-hackathon-docker/server
    ports: ["8080:8000"]
    volumes:
      - ./sdoc-hackathon-docker/data_v2:/data:ro
      - ./sdoc-hackathon-docker/data_v2/ground_truth.json:/secrets/ground_truth.json:ro
    environment: { DATA_DIR: /data, GROUND_TRUTH: /secrets/ground_truth.json }
